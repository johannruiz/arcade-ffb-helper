<!doctype html>
<meta charset="utf-8">
<title>FFB Helper test page</title>
<style>body{font:14px system-ui;background:#0a0c11;color:#eee;padding:24px}button{font:inherit;padding:6px 12px;margin-right:6px}</style>
<h1>FFB Helper test page</h1>
<p>A fake game: a slow left-right torque, a spring and a vibration pulse, as window.arcadeForceFeedback v1.</p>
<p><button id="on">Enable helper</button><button id="off">Disable</button><button id="live">Toggle racing</button></p>
<p>Status: <b id="st">-</b> · <span id="info"></span> · racing: <b id="racing">yes</b></p>
<script>
let racing = true;
window.arcadeForceFeedback = Object.freeze({
  version: 1, game: 'd2',
  read() {
    if (!racing || document.hidden) return { constant: 0, spring: 0, damper: 0, friction: 0, rumble: 0, gain: 0, live: false };
    const t = performance.now() / 1000;
    return { constant: Math.sin(t * 1.3) * 0.7, spring: 0.2, damper: 0.1, friction: 0.05, rumble: (t % 3) < 0.4 ? 0.8 : 0, gain: 1, live: true };
  },
});
</script>
<script src="arcade-ffb-helper.js"></script>
<script>
const $ = id => document.getElementById(id);
arcadeFfbHelper.onChange((s, i) => { $('st').textContent = s; $('info').textContent = i ? JSON.stringify(i) : ''; });
$('on').onclick = () => arcadeFfbHelper.enable();
$('off').onclick = () => arcadeFfbHelper.disable();
$('live').onclick = () => { racing = !racing; $('racing').textContent = racing ? 'yes' : 'no'; };
</script>
