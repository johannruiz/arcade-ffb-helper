name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach files to a release when a v* tag is pushed

jobs:
  windows:
    name: Windows (x64, single exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # SDL3 is compiled from source: keep its build between runs.
      - name: Cache build
        uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      # Runs the exe alone in an empty folder (no DLLs beside it) and asks for its report.
      - name: Smoke test
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP solo
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item out/ArcadeFFBHelper.exe $d
          (Get-Item "$d/ArcadeFFBHelper.exe").VersionInfo | Format-List FileDescription, ProductVersion
          $p = Start-Process -FilePath "$d/ArcadeFFBHelper.exe" -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 3
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:47823/report -TimeoutSec 10
          $text = [Text.Encoding]::UTF8.GetString($r.RawContentStream.ToArray())
          $text -split "`n" | Select-Object -First 14
          Stop-Process -Id $p.Id -Force
          if ($text -notmatch 'Arcade FFB Helper problem report') { throw 'no report' }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: arcade-ffb-helper-windows
          path: out/ArcadeFFBHelper.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/ArcadeFFBHelper.exe

  mac:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-arm64-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 4
          app="out/Arcade FFB Helper.app"
          codesign --force --deep -s - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -info "$app/Contents/MacOS/Arcade FFB Helper"
          ls "$app/Contents/Resources"

      - name: Smoke test
        run: |
          "out/Arcade FFB Helper.app/Contents/MacOS/Arcade FFB Helper" --background &
          pid=$!
          sleep 4
          curl -sf http://127.0.0.1:47823/report -o report.txt
          head -n 14 report.txt
          kill $pid
          grep -q 'Arcade FFB Helper problem report' report.txt

      - name: Package
        run: ditto -c -k --keepParent "out/Arcade FFB Helper.app" out/Arcade-FFB-Helper-mac-arm64.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: arcade-ffb-helper-mac
          path: out/Arcade-FFB-Helper-mac-arm64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/Arcade-FFB-Helper-mac-arm64.zip
