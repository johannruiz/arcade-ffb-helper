name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach files to a release when a v* tag is pushed

jobs:
  mac:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # SDL3 is compiled from source on macOS: keep the build between runs (only
      # ffb_bridge.c is recompiled when it changes). Key changes with CMakeLists.txt.
      - name: Cache SDL3 build
        uses: actions/cache@v6
        with:
          path: native/build
          key: sdl3-${{ runner.os }}-arm64-${{ hashFiles('native/CMakeLists.txt') }}

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Build SDL3 force-feedback bridge
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --config Release -j 4
          lipo -info bin/ffb_bridge
          codesign -dv bin/ffb_bridge 2>&1 || true

      - name: Smoke-test the bridge
        run: printf 'list\nquit\n' | bin/ffb_bridge

      - name: Package app (ad-hoc signed)
        run: npx electron-builder --mac --publish never

      - name: Verify signatures
        run: |
          for app in dist/mac*/"Arcade Launcher.app"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            lipo -info "$app/Contents/Resources/bin/ffb_bridge"
          done

      - name: Self-test on macOS (launcher + the three games from GitHub Pages)
        continue-on-error: true
        env:
          ARCADE_SELFTEST: ${{ runner.temp }}/selftest
          ARCADE_TIMING: '1'
        run: |
          mkdir -p "$ARCADE_SELFTEST"
          ls -la dist
          app=$(find dist -maxdepth 2 -name "*.app" -type d | head -n 1)
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          echo "Running: $exe"
          set +e
          perl -e 'alarm 240; exec @ARGV or die "exec failed: $!\n"' "$exe" > "$ARCADE_SELFTEST/app-output.txt" 2>&1
          code=$?
          set -e
          tail -n 40 "$ARCADE_SELFTEST/app-output.txt"
          node scripts/ci-report.cjs "$ARCADE_SELFTEST" "$code"
          exit $code

      - name: Upload self-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-mac
          path: ${{ runner.temp }}/selftest
          if-no-files-found: ignore

      - name: Upload macOS builds
        uses: actions/upload-artifact@v7
        with:
          name: arcade-launcher-mac
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip

  windows:
    name: Windows (x64, portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache SDL3 + Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            native/third_party
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: deps-${{ runner.os }}-${{ hashFiles('native/CMakeLists.txt', 'package-lock.json') }}

      - run: npm ci

      - name: Build SDL3 force-feedback bridge
        run: |
          cmake -S native -B native/build -A x64
          cmake --build native/build --config Release

      - name: Smoke-test the bridge
        shell: bash
        run: printf 'list\nquit\n' | bin/ffb_bridge.exe

      - name: Package portable folder
        run: |
          npx electron-builder --win dir --publish never
          node scripts/make-portable.cjs
          Compress-Archive -Path "release/Arcade Launcher" -DestinationPath "dist/Arcade-Launcher-win-x64-portable.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: arcade-launcher-windows
          path: dist/Arcade-Launcher-win-x64-portable.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Arcade-Launcher-win-x64-portable.zip
